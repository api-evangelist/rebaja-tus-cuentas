name: Rebaja Tus Cuentas
description: >-
  Rebaja Tus Cuentas is a Latin American consumer fintech, backed by 500 Global,
  that helps individuals lower their debt and monthly loan payments. Through its
  website (rebajatuscuentas.com, redirecting to rtc.pe in Peru) it lets people
  compare refinancing and debt-consolidation offers from banks and lenders to
  reduce the cost of their existing loans, credit cards, and other obligations.
  It operates as a business-to-consumer marketing and lead-generation platform
  built on WordPress and fronted by Cloudflare, with a public blog and help
  center but no publicly documented developer program, API, or integration
  surface at the time of this enrichment pass.
